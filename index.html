<!DOCTYPE html>
<html lang="bg">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Календар">
    <title>Календар</title>
    <link rel="icon" href="favicon.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="stage">
      <div class="app">
        <form id="gate" class="gate">
          <div class="gate-card">
            <h2>Календар</h2>
            <input class="gate-user" type="text" name="username" autocomplete="username" value="va-clima-pleven@gmail.com" tabindex="-1" aria-hidden="true">
            <input id="gate-password" type="password" name="password" placeholder="Парола" autocomplete="current-password" enterkeyhint="go" required>
            <p id="gate-error" class="gate-error" hidden></p>
            <button type="submit" id="gate-submit">Влез</button>
          </div>
        </form>
        <header class="header">
          <div class="topbar">
            <button type="button" id="prev-btn" class="icon-btn" aria-label="Предишен месец">
              <svg viewBox="0 0 13 21" width="12" height="20" aria-hidden="true">
                <path d="M11.2 1.6 L2 10.5 L11.2 19.4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <button type="button" id="today-btn" class="text-btn">Днес</button>
            <span class="spacer"></span>
            <button type="button" id="next-btn" class="icon-btn" aria-label="Следващ месец">
              <svg viewBox="0 0 13 21" width="12" height="20" aria-hidden="true">
                <path d="M1.8 1.6 L11 10.5 L1.8 19.4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <button type="button" id="add-btn" class="icon-btn" aria-label="Ново събитие">
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path d="M12 4.2v15.6M4.2 12h15.6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <h1 id="month-label"></h1>
          <div class="weekdays" aria-hidden="true">
            <span>пн</span>
            <span>вт</span>
            <span>ср</span>
            <span>чт</span>
            <span>пт</span>
            <span>сб</span>
            <span>нд</span>
          </div>
        </header>
        <div id="grid" class="grid" role="group"></div>
        <section class="agenda" aria-label="Събития за избрания ден">
          <h2 id="agenda-label" class="agenda-head"></h2>
          <p id="status" class="status" hidden></p>
          <div id="agenda-list"></div>
        </section>
        <div id="overlay" class="overlay" hidden>
          <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
        </div>
        <div id="confirm" class="confirm-layer" hidden></div>
      </div>
    </div>
    <noscript>
      <p class="noscript">Календарът има нужда от JavaScript.</p>
    </noscript>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script>
    <script src="config.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
